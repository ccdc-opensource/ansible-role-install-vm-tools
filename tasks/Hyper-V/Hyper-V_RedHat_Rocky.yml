---
- name: Install hyperv-daemons on Rocky 8
  ansible.builtin.include_tasks: ../rocky8_packages.yml
  vars:
    rocky8_packages:
      - hyperv-daemons
  when: ansible_distribution == "Rocky" and ansible_distribution_major_version | int == 8

- name: Install hyperv-daemons on Rocky
  when: ansible_distribution == "Rocky" and ansible_distribution_major_version | int >= 9
  ansible.builtin.dnf:
    name: hyperv-daemons
    state: present
  become: true
